<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src *; img-src 'self' data:;" />
  <title>eClass</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">eClass</div>
    <div class="spacer"></div>
    <div id="who" class="who"></div>
    <button id="btnLogout" class="ghost sm">登出</button>
  </header>

  <main class="wrap">
    <!-- STEP 1 登入 -->
    <section id="stepLogin" class="step active">
      <div class="step-head"><span class="num">1</span> 選補習班並登入</div>
      <div class="card">
        <div class="hostgrid" id="hostCards"></div>

        <details class="adv">
          <summary>進階：自訂伺服器</summary>
          <input id="advHost" class="inp" placeholder="自訂 host（例如 makeup.jlweb.com.tw）" />
        </details>

        <div class="field">
          <label>補習班代碼 (Code)</label>
          <input id="code" class="inp" inputmode="numeric" placeholder="例如 0102" />
        </div>
        <div class="field2">
          <div class="field">
            <label>學號</label>
            <input id="stuSN" class="inp" placeholder="學號" />
          </div>
          <div class="field">
            <label>密碼</label>
            <input id="stuPass" class="inp" type="password" placeholder="密碼" />
          </div>
        </div>
        <button id="btnLogin" class="primary big">登入</button>
      </div>
    </section>

    <!-- STEP 2 課程 -->
    <section id="stepBrowse" class="step">
      <div class="step-head"><span class="num">2</span> 選課程 → 單元 → 分段</div>
      <div class="browse">
        <div class="pane">
          <div class="pane-title">課程</div>
          <div id="classList" class="itemlist"></div>
        </div>
        <div class="pane">
          <div class="pane-title">單元</div>
          <div id="unitList" class="itemlist"><div class="empty">先選左邊課程</div></div>
        </div>
        <div class="pane">
          <div class="pane-title">分段（點擊播放）</div>
          <div id="segList" class="itemlist"><div class="empty">先選單元</div></div>
        </div>
      </div>
    </section>

    <!-- STEP 3 播放 -->
    <section id="stepPlay" class="step">
      <div class="step-head"><span class="num">3</span> 播放</div>
      <div class="card">
        <video id="player" class="player" controls playsinline webkit-playsinline></video>
        <div id="playHint" class="hint"></div>
        <div class="urlrow">
          <input id="curUrl" class="inp mono" readonly placeholder="影片連結 (expire/token)" />
          <button id="btnVlc" class="ghost">用 VLC 開</button>
        </div>
      </div>
    </section>
  </main>

  <div id="busy" class="busy"><div class="spinner"></div><div id="busyLabel">載入中…</div></div>
  <div id="toast" class="toast"></div>
  <div id="machine" class="machine"></div>

  <!-- 平台 facade：Electron 用 preload IPC adapter -->
  <script src="adapter-electron.js"></script>
  <script src="ui.js"></script>
</body>
</html>
