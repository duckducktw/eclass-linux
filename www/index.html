<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>eClass</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">eClass</div>
    <div class="spacer"></div>
    <div id="who" class="who"></div>
    <button id="btnLogout" class="ghost sm">登出</button>
  </header>

  <main class="wrap">
    <!-- STEP 1 登入 -->
    <section id="stepLogin" class="step active">
      <div class="step-head"><span class="num">1</span> 登入</div>
      <div class="card">
        <p class="sublead">輸入補習班給的代碼與帳密，系統會自動找到你的補習班。</p>
        <div class="field">
          <label>補習班代碼 (Code)</label>
          <input id="code" class="inp" inputmode="numeric" placeholder="例如 0102" />
        </div>
        <div class="field2">
          <div class="field">
            <label>學號</label>
            <input id="stuSN" class="inp" placeholder="學號" />
          </div>
          <div class="field">
            <label>密碼</label>
            <input id="stuPass" class="inp" type="password" placeholder="密碼" />
          </div>
        </div>
        <button id="btnLogin" class="primary big">登入</button>
      </div>
    </section>

    <!-- STEP 2 課程（一頁一頁：課程 → 單元 → 分段） -->
    <section id="stepBrowse" class="step">
      <!-- 2a 課程頁 -->
      <div id="pageClasses" class="subpage active">
        <div class="step-head"><span class="num">2</span> 選擇課程</div>
        <div id="classList" class="itemlist big"></div>
      </div>
      <!-- 2b 單元頁 -->
      <div id="pageUnits" class="subpage">
        <div class="nav-head">
          <button id="backToClasses" class="ghost sm back">‹ 課程</button>
          <div id="crumbClass" class="crumb"></div>
        </div>
        <div class="step-head"><span class="num">2</span> 選擇單元</div>
        <div id="unitList" class="itemlist big"></div>
      </div>
      <!-- 2c 分段頁 -->
      <div id="pageSegs" class="subpage">
        <div class="nav-head">
          <button id="backToUnits" class="ghost sm back">‹ 單元</button>
          <div id="crumbUnit" class="crumb"></div>
        </div>
        <div class="step-head"><span class="num">2</span> 選擇分段（點播放）</div>
        <div id="segList" class="itemlist big"></div>
      </div>
    </section>

    <!-- STEP 3 播放 -->
    <section id="stepPlay" class="step">
      <div class="nav-head">
        <button id="backToSegs" class="ghost sm back">‹ 分段</button>
        <div id="crumbSeg" class="crumb"></div>
      </div>
      <div class="step-head"><span class="num">3</span> 播放</div>
      <div class="card">
        <video id="player" class="player" controls playsinline webkit-playsinline></video>
        <div id="playHint" class="hint"></div>
        <div class="urlrow">
          <input id="curUrl" class="inp mono" readonly placeholder="影片連結 (expire/token)" />
          <button id="btnVlc" class="ghost">用外部播放器</button>
        </div>
      </div>
    </section>
  </main>

  <div id="busy" class="busy"><div class="spinner"></div><div id="busyLabel">載入中…</div></div>
  <div id="toast" class="toast"></div>
  <div id="machine" class="machine"></div>

  <!-- 多補習班命中時的選擇彈窗 -->
  <div id="picker" class="modal">
    <div class="modal-box">
      <div class="modal-title">找到多間補習班，請選擇</div>
      <div id="pickerList" class="itemlist"></div>
      <button id="pickerCancel" class="ghost" style="margin-top:12px;width:100%">取消</button>
    </div>
  </div>

  <!-- 平台無關 core (UMD) -->
  <script src="js/core/md5.js"></script>
  <script src="js/core/moviesign-core.js"></script>
  <script src="js/core/parse-core.js"></script>
  <script src="js/core/eclass-core.js"></script>
  <script src="js/core/schools.js"></script>
  <!-- Android 平台層 (CapacitorHttp + 裝置ID) + facade -->
  <script src="js/platform-capacitor.js"></script>
  <script src="js/adapter-capacitor.js"></script>
  <!-- 共用 UI -->
  <script src="js/ui.js"></script>
</body>
</html>
